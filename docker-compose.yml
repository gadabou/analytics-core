  ih-cht-manage-cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: ih-cht-manage-cloudbeaver
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DBEAVER_PORT:?DBEAVER_PORT must be set}:8978"
    # volumes:
    #   - ${DBEAVER_DATA_DIR:-./app_data/cloudbeaver}:/opt/cloudbeaver/workspace
    environment:
      CB_SERVER_NAME: ${DBEAVER_SERVER_NAME:-IH-CHT CloudBeaver}
      CB_ADMIN_NAME: ${DBEAVER_ADMIN_NAME:?DBEAVER_ADMIN_NAME must be set}
      CB_ADMIN_PASSWORD: ${DBEAVER_ADMIN_PASSWORD:?DBEAVER_ADMIN_PASSWORD must be set}
      CB_SESSION_EXPIRE_TIME: 1440
    networks:
      - ih-cht-manage-net
    depends_on:
      ih-cht-init-volumes:
        condition: service_healthy
      ih-cht-manage-postgres:
        condition: service_healthy


networks:
  ih-cht-manage-net:
    driver: bridge
    # external: true