<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form 3D - Informations Personnelles</title>

  <style>
    :root{
      --bg1:#eef5ff;
      --bg2:#d8e7ff;

      --txt:#274a78;
      --muted:#6f87aa;

      --surface:#f7fbff;
      --surface2:#e8f1ff;
      --border:#cfe0ff;

      --blue1:#1b7bff;
      --blue2:#0d58e3;

      --shadowA: 0 18px 40px rgba(18, 61, 120, .22);
      --shadowB: 0 10px 22px rgba(18, 61, 120, .16);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--txt);
      background: radial-gradient(1200px 520px at 50% 25%, #ffffff 0%, var(--bg1) 35%, var(--bg2) 100%);
    }

    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:40px 18px;
    }

    .card3d{
      width:min(980px, 100%);
      padding: 34px 26px 40px;
    }

    .title{
      text-align:center;
      margin: 0 0 14px;
      font-size: 34px;
      letter-spacing: .3px;
      color:#2d63a7;
      font-weight: 800;
    }

    .divider{
      height:1px;
      width: 100%;
      background: linear-gradient(90deg, transparent, rgba(140,170,220,.45), transparent);
      margin: 10px 0 26px;
    }

    .form3d{ width:100%; }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px 34px;
    }

    .field{ display:flex; flex-direction:column; gap: 10px; }

    .label{
      font-size: 20px;
      font-weight: 800;
      color:#2f5f9f;
    }

    .control3d{
      position:relative;
      height: 64px;
      border-radius: 18px;
      padding: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(235,245,255,.78));
      border: 1px solid rgba(170,200,245,.9);
      box-shadow: var(--shadowB);
      overflow:hidden;
      transform: translateY(0);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    /* double bordure (capsule) */
    .control3d::before{
      content:"";
      position:absolute;
      inset: 5px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(240,248,255,.85));
      border: 2px solid rgba(150, 190, 255, .65);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(120,160,220,.20);
      pointer-events:none;
    }

    .input3d{
      position:relative;
      z-index:1;
      width:100%;
      height: 100%;
      border:none;
      outline:none;
      border-radius: 14px;
      background: transparent;
      font-size: 22px;
      color:#2a4b7a;
      padding: 0 18px;
    }

    /* icons spacing */
    .has-icon-left .input3d{ padding-left: 62px; }
    .has-icon-right .input3d{ padding-right: 56px; }

    .icon{
      position:absolute;
      z-index:2;
      width:44px;
      height:44px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      top: 10px;
      background: linear-gradient(180deg, rgba(230,245,255,.95), rgba(210,230,255,.85));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 8px 16px rgba(15,60,130,.14);
    }
    .icon.left{ left: 12px; }
    .icon.right{ right: 12px; background: transparent; box-shadow:none; }

    .icon svg{
      width: 22px;
      height: 22px;
      fill:none;
      stroke:#5f7fa8;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* select styling */
    select.input3d{
      -webkit-appearance:none;
      appearance:none;
      cursor:pointer;
    }

    /* flag */
    .flag{
      position:absolute;
      z-index:2;
      left: 16px;
      top: 16px;
      font-size: 22px;
      line-height: 1;
    }
    .flag + select.input3d{ padding-left: 56px; }

    /* focus glow + lift */
    .control3d:focus-within{
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(18, 61, 120, .20);
    }
    .control3d:focus-within::before{
      border-color: rgba(45, 140, 255, .75);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 0 0 6px rgba(45, 140, 255, .10);
    }

    /* password row centered */
    .password-row{
      display:flex;
      justify-content:center;
      margin: 24px 0 18px;
    }
    .control3d.pass{
      width: min(560px, 100%);
      height: 66px;
    }
    .control3d.pass::before{
      inset: 6px;
    }
    .control3d.pass .icon.left{
      left: 14px;
      top: 11px;
    }

    .pass-label{
      position:absolute;
      z-index:2;
      left: 70px;
      top: 18px;
      font-size: 22px;
      font-weight: 800;
      color:#2a4b7a;
      opacity:.95;
      pointer-events:none;
    }
    .pass-input{
      padding-left: 210px;
      padding-right: 70px;
    }

    .eye-btn{
      position:absolute;
      z-index:3;
      right: 14px;
      top: 12px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: none;
      background: transparent;
      cursor:pointer;
      display:grid;
      place-items:center;
      transition: transform .18s ease;
    }
    .eye-btn:active{ transform: scale(.96); }
    .eye-btn svg{
      width: 24px;
      height: 24px;
      fill:none;
      stroke:#5f7fa8;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .eye-off{ display:none; }
    .eye-btn.is-open .eye{ display:none; }
    .eye-btn.is-open .eye-off{ display:block; }

    /* action button 3D */
    .actions{
      display:flex;
      justify-content:center;
      margin-top: 10px;
    }
    .btn3d{
      width: min(520px, 100%);
      height: 74px;
      border:none;
      border-radius: 22px;
      background: linear-gradient(180deg, var(--blue1), var(--blue2));
      color:#fff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .3px;
      cursor:pointer;
      box-shadow:
        0 18px 36px rgba(8, 70, 180, .40),
        inset 0 2px 0 rgba(255,255,255,.25);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn3d:hover{
      transform: translateY(-2px);
      filter: saturate(1.06);
      box-shadow:
        0 22px 44px rgba(8, 70, 180, .45),
        inset 0 2px 0 rgba(255,255,255,.25);
    }
    .btn3d:active{
      transform: translateY(0px);
      box-shadow:
        0 14px 28px rgba(8, 70, 180, .35),
        inset 0 2px 0 rgba(255,255,255,.18);
    }

    /* responsive */
    @media (max-width: 860px){
      .grid2{ grid-template-columns: 1fr; gap: 18px; }
      .label{ font-size: 18px; }
      .input3d{ font-size: 20px; }
      .title{ font-size: 28px; }
      .pass-label{ font-size: 20px; }
      .pass-input{ padding-left: 190px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card3d">
      <h1 class="title">Informations Personnelles</h1>
      <div class="divider"></div>

      <form class="form3d" id="form3d">
        <div class="grid2">

          <div class="field">
            <label class="label">Prénom</label>
            <div class="control3d">
              <input class="input3d" type="text" value="Jean" placeholder="Prénom" />
            </div>
          </div>

          <div class="field">
            <label class="label">Nom</label>
            <div class="control3d">
              <input class="input3d" type="text" value="Dupont" placeholder="Nom" />
            </div>
          </div>

          <div class="field">
            <label class="label">Email</label>
            <div class="control3d has-icon-left">
              <span class="icon left" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M4 6h16v12H4z"></path>
                  <path d="M4 7l8 6 8-6"></path>
                </svg>
              </span>
              <input class="input3d" type="email" value="jean.dupont@email.com" placeholder="Email" />
            </div>
          </div>

          <div class="field">
            <label class="label">Téléphone</label>
            <div class="control3d has-icon-left">
              <span class="icon left" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M6.5 3.5l3.2 2.2-1.3 2.6c1.6 2.8 3.8 5 6.6 6.6l2.6-1.3 2.2 3.2c.3.5.2 1.1-.2 1.5l-1.4 1.4c-.4.4-1 .6-1.6.5-5.4-.7-12-7.3-12.7-12.7-.1-.6.1-1.2.5-1.6l1.4-1.4c.4-.4 1-.5 1.5-.2z"></path>
                </svg>
              </span>
              <input class="input3d" type="tel" value="+33 6 12 34 56 78" placeholder="Téléphone" />
            </div>
          </div>

          <div class="field">
            <label class="label">Date de Naissance</label>
            <div class="control3d has-icon-right">
              <input class="input3d" type="text" value="15/08/1985" placeholder="JJ/MM/AAAA" />
              <span class="icon right" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M7 3v3M17 3v3"></path>
                  <path d="M4 7h16v14H4z"></path>
                  <path d="M4 11h16"></path>
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="label">Pays</label>
            <div class="control3d has-icon-right">
              <div class="flag">🇫🇷</div>
              <select class="input3d">
                <option>France</option>
                <option>Togo</option>
                <option>Burkina Faso</option>
              </select>
              <span class="icon right" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="label">Genre</label>
            <div class="control3d has-icon-left has-icon-right">
              <span class="icon left" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"></path>
                  <path d="M4 21a8 8 0 0 1 16 0"></path>
                </svg>
              </span>
              <select class="input3d">
                <option>Homme</option>
                <option>Femme</option>
                <option>Autre</option>
              </select>
              <span class="icon right" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="label">Ville</label>
            <div class="control3d has-icon-left">
              <span class="icon left" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 21s7-4.4 7-11a7 7 0 0 0-14 0c0 6.6 7 11 7 11z"></path>
                  <path d="M12 10a2 2 0 1 0-2-2 2 2 0 0 0 2 2z"></path>
                </svg>
              </span>
              <input class="input3d" type="text" value="Paris" placeholder="Ville" />
            </div>
          </div>

        </div>

        <div class="password-row">
          <div class="control3d has-icon-left has-icon-right pass">
            <span class="icon left" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 11V8a5 5 0 0 1 10 0v3"></path>
                <path d="M6 11h12v10H6z"></path>
              </svg>
            </span>

            <span class="pass-label">Mot de Passe</span>
            <input id="password" class="input3d pass-input" type="password" value="motdepasse123" />

            <button type="button" class="eye-btn" id="togglePassword" aria-label="Afficher/Masquer le mot de passe">
              <svg class="eye" viewBox="0 0 24 24">
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
                <path d="M12 15a3 3 0 1 0-3-3 3 3 0 0 0 3 3z"></path>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24">
                <path d="M2 12s4-7 10-7c2.2 0 4.1.7 5.7 1.6"></path>
                <path d="M22 12s-4 7-10 7c-2.2 0-4.1-.7-5.7-1.6"></path>
                <path d="M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="actions">
          <button class="btn3d" type="submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ✅ Toggle password (œil) + micro animation
    (function () {
      const pass = document.getElementById("password");
      const btn = document.getElementById("togglePassword");

      if (pass && btn) {
        btn.addEventListener("click", () => {
          const open = pass.type === "password";
          pass.type = open ? "text" : "password";
          btn.classList.toggle("is-open", open);

          btn.animate(
            [{ transform: "scale(1)" }, { transform: "scale(0.92)" }, { transform: "scale(1)" }],
            { duration: 180, easing: "ease-out" }
          );
        });
      }

      // ✅ submit demo
      document.getElementById("form3d")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const btnSave = document.querySelector(".btn3d");
        btnSave?.animate(
          [{ transform: "translateY(0)" }, { transform: "translateY(2px) scale(.99)" }, { transform: "translateY(0)" }],
          { duration: 220, easing: "ease-out" }
        );
      });
    })();
  </script>
</body>
</html>
